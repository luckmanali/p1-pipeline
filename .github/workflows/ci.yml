name: Pipeline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked test dependencies (no model runtimes)
        run: uv sync --locked --only-group dev
      - name: Unit and generated-video tests with branch coverage
        run: uv run --locked --only-group dev python -m coverage run --branch -m unittest discover -s tests -v
      - name: Coverage report
        run: |
          uv run --locked --only-group dev python -m coverage report -m
          uv run --locked --only-group dev python -m coverage xml
      - name: Check whitespace
        run: git show --check --format= --diff-merges=first-parent HEAD
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-coverage
          path: coverage.xml
          if-no-files-found: warn
